name: Sync Notion and GitHub Projects

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-notion:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Notion synchronization
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "X-Sync-Token: ${SYNC_SECRET}" \
            "https://notion-project-dashboard-api.onrender.com/api/sync/notion"

  sync-github:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger GitHub synchronization
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "X-Sync-Token: ${SYNC_SECRET}" \
            "https://notion-project-dashboard-api.onrender.com/api/sync/github"